<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定了么 · 观潮</title><link rel="stylesheet" href="decision.css"><script src="decision.js" defer></script></head><body>
<main class="decision"><header><p class="eyebrow">A LITTLE HELP WITH CHOOSING</p><h1>定了么<span>？</span></h1><p>小事纠结一下，就交给一点随机。</p></header>
<nav class="choice-tabs" aria-label="决定方式"><button type="button" data-mode="wheel" aria-pressed="true">转盘</button><button type="button" data-mode="coin" aria-pressed="false">抛硬币</button></nav>
<section id="wheelPanel" class="wheel-panel" aria-label="自由选项转盘"><div class="wheel-stage"><div class="wheel-pointer" aria-hidden="true"></div><canvas id="wheelCanvas" width="640" height="640" aria-label="等概率选项转盘"></canvas><button type="button" id="wheelCenter" class="wheel-center" aria-label="点击定，转动转盘">定</button></div><div class="wheel-settings"><h2 id="optionsHeading">写下你的选项</h2><p class="hint" id="optionsHint">一个选项一条，点加号继续添加。空白项不参与转盘。</p><div id="optionsList" class="options-list" role="group" aria-labelledby="optionsHeading" aria-describedby="optionsHint"></div><button id="addOption" class="add-option" type="button"><span aria-hidden="true">＋</span> 添加选项</button><p id="optionCount" class="hint"></p><button id="spinButton" class="primary" type="button">转一下，定了</button><p id="wheelResult" class="result" role="status">先写下至少两个选项。</p><p id="saveStatus" class="hint" role="status"></p></div></section>
<section id="coinPanel" class="coin-panel" aria-label="抛硬币" hidden><div id="coinStage" class="coin-stage"><div class="coin-shadow" aria-hidden="true"></div><div class="coin-flight"><div id="coin" class="coin" aria-hidden="true"><div class="coin-rim"></div><div class="coin-face coin-heads"><span><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="32" r="13" fill="#fff0c2" stroke="#9c773d" stroke-width="2"/><path d="M32 5v7m0 40v7M5 32h7m40 0h7M13 13l5 5m28 28 5 5M13 51l5-5m28-28 5-5" stroke="#9c773d" stroke-width="3" stroke-linecap="round"/></svg></span><small>太阳 · 正面</small></div><div class="coin-face coin-tails"><span><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M43 8a25 25 0 1 0 13 37A24 24 0 0 1 43 8Z" fill="#eef0ff" stroke="#7e6ba6" stroke-width="2"/><path d="m47 22 1.5 4.5L53 28l-4.5 1.5L47 34l-1.5-4.5L41 28l4.5-1.5Z" fill="#f3e9ff"/></svg></span><small>月亮 · 反面</small></div></div></div></div><p class="hint">太阳、月亮各一半机会。先给两面约定一个含义。</p><button id="coinButton" class="primary" type="button">抛一下</button><p id="coinResult" class="result" role="status">想好你的问题了吗？</p></section>
<p class="footnote">转盘选项只保存在本机。随机结果给你一点灵感，最后由你决定。</p></main>
</body></html>
